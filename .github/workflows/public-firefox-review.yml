name: Vytal Firefox visual smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-firefox-review.yml'

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: landing-page-reference-redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and browser driver
        run: |
          npm ci
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Build and start preview
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Firefox route smoke
        run: |
          mkdir -p firefox-review
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core'

          const browser = await puppeteer.launch({
            browser: 'firefox',
            headless: true,
            executablePath: '/usr/bin/firefox',
          })
          const base = 'http://127.0.0.1:4173'
          const routes = [
            ['home', '/'],
            ['screenings', '/screenings'],
            ['science', '/science'],
            ['impact', '/impact'],
            ['about', '/about'],
            ['journey', '/journey'],
            ['platform', '/platform'],
            ['privacy', '/privacy'],
            ['medical-disclaimer', '/medical-disclaimer'],
          ]
          const clinical = [
            ['scan', '/scan'],
            ['dashboard', '/dashboard'],
            ['report', '/report'],
          ]

          async function ready(page, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle0' })
            await page.evaluate(() => document.fonts?.ready)
            await new Promise((resolve) => setTimeout(resolve, 150))
          }

          for (const [label, width, height] of [['390', 390, 844], ['1440', 1440, 900]]) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            for (const [name, route] of routes) {
              await ready(page, route)
              const state = await page.evaluate(() => ({
                width: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
                viewport: window.innerWidth,
                h1Count: document.querySelectorAll('h1').length,
              }))
              if (state.width > state.viewport + 1) throw new Error(`${route} overflows in Firefox at ${width}px`)
              if (state.h1Count !== 1) throw new Error(`${route} has ${state.h1Count} H1s in Firefox at ${width}px`)
              await page.screenshot({
                path: `firefox-review/${label}-${name}.jpg`,
                type: 'jpeg',
                quality: 74,
                fullPage: true,
              })
            }
            for (const [name, route] of clinical) {
              await ready(page, route)
              const leaked = await page.evaluate(() => Boolean(document.querySelector('.public-nav-wrap')))
              if (leaked) throw new Error(`Public navigation leaked into ${route} in Firefox`)
              await page.screenshot({
                path: `firefox-review/${label}-clinical-${name}.jpg`,
                type: 'jpeg',
                quality: 74,
                fullPage: true,
              })
            }
            await page.close()
          }
          await browser.close()
          NODE

      - name: Upload Firefox evidence
        uses: actions/upload-artifact@v4
        with:
          name: vytal-firefox-visual-smoke
          path: firefox-review
          if-no-files-found: error
