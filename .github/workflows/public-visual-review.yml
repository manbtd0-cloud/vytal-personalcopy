name: Vytal public visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/public/**'
      - '.github/workflows/public-visual-review.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: landing-page-reference-redesign

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app and visual-review driver
        run: |
          npm ci
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Capture final public visual gates
        run: |
          mkdir -p visual-review/home visual-review/routes visual-review/clinical
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import puppeteer from 'puppeteer-core'

          const browser = await puppeteer.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          })

          const base = 'http://127.0.0.1:4173'
          const publicRoutes = [
            ['home', '/'],
            ['screenings', '/screenings'],
            ['science', '/science'],
            ['impact', '/impact'],
            ['about', '/about'],
            ['journey', '/journey'],
            ['platform', '/platform'],
            ['privacy', '/privacy'],
            ['medical-disclaimer', '/medical-disclaimer'],
          ]
          const clinicalRoutes = [
            ['scan', '/scan'],
            ['dashboard', '/dashboard'],
            ['report', '/report'],
          ]
          const chapterNames = [
            'hero', 'access-thesis', 'proof', 'science-lineage', 'context-stories',
            'signal-journey', 'signal-band', 'documentary-run', 'trust-reset',
            'evidence', 'language-band', 'platform-arc', 'concrete-value', 'final-entry',
          ]
          const allWidths = [
            ['360', 360, 800],
            ['390', 390, 844],
            ['430', 430, 932],
            ['768', 768, 1024],
            ['1024', 1024, 768],
            ['1280', 1280, 800],
            ['1440', 1440, 900],
            ['1920', 1920, 1080],
          ]
          const diagnostics = []

          async function waitForReady(page) {
            await page.evaluate(() => document.fonts?.ready)
            await new Promise((resolve) => setTimeout(resolve, 200))
          }

          async function open(page, route) {
            await page.goto(`${base}${route}`, { waitUntil: 'networkidle0' })
            await waitForReady(page)
          }

          async function inspectRoute(page, name, route, width) {
            await open(page, route)
            const result = await page.evaluate(() => {
              const root = document.documentElement
              const body = document.body
              const skip = document.querySelector('.public-skip-link')
              const skipRect = skip?.getBoundingClientRect()
              const skipStyle = skip ? getComputedStyle(skip) : null
              const active = document.activeElement
              const nav = document.querySelector('.public-nav-wrap')
              const maxWidth = Math.max(root.scrollWidth, body.scrollWidth)
              const skipUnexpectedlyVisible = Boolean(
                skip &&
                active !== skip &&
                skipStyle?.visibility !== 'hidden' &&
                skipStyle?.display !== 'none' &&
                skipRect &&
                skipRect.bottom > 0 &&
                skipRect.top < window.innerHeight,
              )
              return {
                viewportWidth: window.innerWidth,
                documentWidth: maxWidth,
                overflow: maxWidth > window.innerWidth + 1,
                h1Count: document.querySelectorAll('h1').length,
                hasPublicNav: Boolean(nav),
                activeElement: active?.tagName ?? null,
                skipUnexpectedlyVisible,
              }
            })
            diagnostics.push({ name, route, width, ...result })
            if (result.overflow) throw new Error(`${route} overflows at ${width}px: ${result.documentWidth}px`)
            if (result.h1Count !== 1) throw new Error(`${route} has ${result.h1Count} H1 elements at ${width}px`)
            if (result.skipUnexpectedlyVisible) throw new Error(`${route} exposes unfocused skip link at ${width}px`)
            return result
          }

          async function screenshot(page, path, fullPage = true) {
            await page.screenshot({
              path,
              type: 'jpeg',
              quality: 76,
              fullPage,
              captureBeyondViewport: fullPage,
            })
          }

          // Objective responsive diagnostics at every required width on every public route.
          for (const [label, width, height] of allWidths) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            for (const [name, route] of publicRoutes) {
              await inspectRoute(page, name, route, width)
            }
            await page.close()
          }

          // Gate C complete-Home evidence at every required Home width.
          for (const [label, width, height] of allWidths.filter(([label]) => ['360', '390', '430', '768', '1024', '1440', '1920'].includes(label))) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            await open(page, '/')
            await screenshot(page, `visual-review/home/full-${label}.jpg`)
            await page.close()
          }

          // Gate A/B chapter-entry evidence. 390 and 1440 cover all H01-H14;
          // 768 covers A/B; 1920 covers Gate A and final wide-screen art direction.
          const chapterSets = [
            ['390', 390, 844, chapterNames],
            ['768', 768, 1024, chapterNames.slice(0, 6)],
            ['1440', 1440, 900, chapterNames],
            ['1920', 1920, 1080, chapterNames.slice(0, 3)],
          ]
          for (const [label, width, height, names] of chapterSets) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            await open(page, '/')
            for (const name of names) {
              const found = await page.$(`[data-home-chapter="${name}"]`)
              if (!found) throw new Error(`Missing Home chapter ${name}`)
              await page.evaluate((chapter) => {
                const node = document.querySelector(`[data-home-chapter="${chapter}"]`)
                const top = node.getBoundingClientRect().top + window.scrollY
                window.scrollTo({ top: Math.max(0, top - 92), behavior: 'instant' })
              }, name)
              await new Promise((resolve) => setTimeout(resolve, 120))
              await screenshot(page, `visual-review/home/${label}-${name}.jpg`, false)
            }
            await page.close()
          }

          // Gate D full-route evidence at 390 / 768 / 1440.
          for (const [label, width, height] of allWidths.filter(([label]) => ['390', '768', '1440'].includes(label))) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            for (const [name, route] of publicRoutes.slice(1)) {
              await open(page, route)
              await screenshot(page, `visual-review/routes/${label}-${name}.jpg`)
            }
            await page.close()
          }

          // Required 1920 Gate-D evidence for Science and Platform.
          {
            const page = await browser.newPage()
            await page.setViewport({ width: 1920, height: 1080, deviceScaleFactor: 1 })
            for (const [name, route] of [['science', '/science'], ['platform', '/platform']]) {
              await open(page, route)
              await screenshot(page, `visual-review/routes/1920-${name}.jpg`)
            }
            await page.close()
          }

          // Clinical isolation regression: public navigation must not leak into clinical routes.
          for (const [label, width, height] of [['390', 390, 844], ['1440', 1440, 900]]) {
            const page = await browser.newPage()
            await page.setViewport({ width, height, deviceScaleFactor: 1 })
            for (const [name, route] of clinicalRoutes) {
              await open(page, route)
              const hasPublicNav = await page.evaluate(() => Boolean(document.querySelector('.public-nav-wrap')))
              if (hasPublicNav) throw new Error(`Public navigation leaked into ${route}`)
              await screenshot(page, `visual-review/clinical/${label}-${name}.jpg`)
            }
            await page.close()
          }

          // Reduced-motion smoke at the Home route.
          {
            const page = await browser.newPage()
            await page.setViewport({ width: 390, height: 844, deviceScaleFactor: 1 })
            await page.emulateMediaFeatures([{ name: 'prefers-reduced-motion', value: 'reduce' }])
            await open(page, '/')
            await screenshot(page, 'visual-review/home/390-reduced-motion.jpg')
            await page.close()
          }

          await writeFile('visual-review/diagnostics.json', JSON.stringify(diagnostics, null, 2))
          await browser.close()
          NODE

      - name: Upload visual-review evidence
        uses: actions/upload-artifact@v4
        with:
          name: vytal-public-final-visual-review
          path: visual-review
          if-no-files-found: error
